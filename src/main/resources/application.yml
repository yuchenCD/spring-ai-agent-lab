server:
  port: 8080

spring:
  application:
    name: spring-ai-agent-lab
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

agent:
  llm:
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    timeout: 30s
    # 429/5xx 与连接失败的自动重试次数（含首次）；退避 300ms 起指数增长
    max-attempts: 3
    retry-backoff: 300ms
  loop:
    max-steps: 6
    # 同一轮内并行工具调用的批处理截止时间
    tool-timeout: 10s
    parallel-tools: true
  memory:
    max-messages: 20
    # in-memory（默认，零依赖）或 redis（配合 docker compose 的 redis 服务）
    type: in-memory
    ttl: 24h
  embedding:
    # 任何 OpenAI 兼容 /embeddings 端点；api-key 为空时自动使用离线 hashing embedding
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: 256
  rag:
    # in-memory（默认，零依赖）或 pgvector（需要 PostgreSQL + pgvector 扩展）
    store: ${AGENT_RAG_STORE:in-memory}
    chunk-size: 500
    chunk-overlap: 80
    top-k: 4
  pgvector:
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/agentlab}
    username: ${PGVECTOR_USER:agentlab}
    password: ${PGVECTOR_PASSWORD:agentlab}
    # 必须与 embedding 维度一致：离线 hashing 默认 256
    dimensions: ${PGVECTOR_DIMENSIONS:256}
  mcp:
    # 每个 server 会以子进程方式启动，工具注册为 mcp__<name>__<tool>
    servers: []

logging:
  level:
    io.github.yuchencd.agentlab: INFO
