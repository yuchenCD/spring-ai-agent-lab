services:
  agent-lab:
    build: .
    image: spring-ai-agent-lab:local
    ports:
      - "8080:8080"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 会话记忆切到 Redis：改成 redis 即可
      AGENT_MEMORY_TYPE: ${AGENT_MEMORY_TYPE:-in-memory}
      SPRING_DATA_REDIS_HOST: redis
      # 可选：接真实 embedding 服务（为空时用离线 hashing embedding）
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # 向量库：in-memory（默认）或 pgvector
      AGENT_RAG_STORE: ${AGENT_RAG_STORE:-in-memory}
      PGVECTOR_URL: jdbc:postgresql://pgvector:5432/agentlab
      PGVECTOR_USER: agentlab
      PGVECTOR_PASSWORD: agentlab
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 只有当 AGENT_RAG_STORE=pgvector 时才被应用使用
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentlab
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: agentlab
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlab -d agentlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector-data:
